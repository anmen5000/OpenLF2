      el("div", {"class": "card"}, [el("b", null, [num(meta.games)]), el("span", null, [t("played")])]),
      el("div", {"class": "card"}, [el("b", null, [games ? pct(draws / games) : "—"]), el("span", null, [t("drawsCard")])]),
      el("div", {"class": "card"}, [el("b", null, [games ? num(ticks / games / 30, 0) + " " + t("seconds") : "—"]), el("span", null, [t("avgLen")])])
    ]);
  }
  function tabs() {
    var list = [["rank", "tabRank"], ["matrix", "tabMatrix"], ["fighter", "tabFighter"], ["draws", "tabDraws"], ["read", "tabRead"]];
    return el("nav", {"class": "tabs"}, list.map(function (x) {
      return el("button", {"class": tab === x[0] ? "on" : "", on: {click: function () { tab = x[0]; render(); }}}, [t(x[1])]);
    }));
  }

  function rankView() {
    var columns = [
      {label: t("cRank"), value: function (f) { return ranked.indexOf(f) + 1; }},
      {label: t("cName"), cls: "l", value: function (f) { return f.name.toLowerCase(); }, show: nameLink},
      {label: t("cRate"), value: function (f) { return f.p; }, show: function (f) { return rateBar(f.p, f.m); }},
      {label: t("cMargin"), value: function (f) { return f.m; }, show: function (f) { return "±" + num(f.m * 100, 1); }},
      {label: t("cWins"), value: function (f) { return f.wins; }, show: function (f) { return num(f.wins); }},
      {label: t("cDraws"), value: function (f) { return f.draws; }, show: function (f) { return num(f.draws); }},
      {label: t("cLosses"), value: function (f) { return f.losses; }, show: function (f) { return num(f.losses); }},
      {label: t("cGames"), value: function (f) { return f.games; }, show: function (f) { return num(f.games); }},
      {label: t("cDealt"), value: function (f) { return f.dealt / f.games; }, show: function (f) { return num(f.dealt / f.games); }},
      {label: t("cTaken"), value: function (f) { return f.taken / f.games; }, show: function (f) { return num(f.taken / f.games); }},
      {label: t("cHpWin"), value: function (f) { return f.wins ? f.hpwin / f.wins : 0; }, show: function (f) { return f.wins ? num(f.hpwin / f.wins) : "—"; }},
      {label: t("cLen"), value: function (f) { return f.ticks / f.games; }, show: function (f) { return num(f.ticks / f.games / 30, 0); }}
    ];
    return el("div", null, [el("p", {"class": "muted"}, [t("rankIntro")]), el("div", {"class": "panel"}, [table(columns, ranked, 2)])]);
  }

  function matrixView() {
    var order = ranked;
    var head = el("tr", null, [el("th", {"class": "row"}, [""])].concat(order.map(function (f) {
      return el("th", {"class": "col", title: f.name}, [f.name]);
    })));
    var rows = order.map(function (x) {
      return el("tr", null, [el("th", {"class": "row"}, [nameLink(x)])].concat(order.map(function (y) {
        if (x.id === y.id) return el("td", {"class": "self"}, ["·"]);
        var mu = matchup(x.id, y.id);
        if (!mu || !mu.games) return el("td", {"class": "self"}, ["—"]);
        var title = x.name + " — " + y.name + ": " + pct(mu.p) + " ±" + num(mu.m * 100, 1) + " (" + t("cWins") + " " + mu.wins +
          ", " + t("cDraws") + " " + mu.draws + ", " + t("cLosses") + " " + mu.losses + "; " + mu.games + " " + t("games") + ")";
        return el("td", {"class": mu.games < FEW ? "few" : "", style: tint(mu.p, mu.games), title: title}, [num(mu.p * 100, 0)]);
      })));
    });
    var legend = el("div", {"class": "legend"}, [
      el("span", {"class": "swatch", style: tint(0.15)}), t("lose"),
      el("span", {"class": "swatch", style: "background:transparent"}), t("even"),
      el("span", {"class": "swatch", style: tint(0.85)}), t("win")
    ]);
    var csv = el("button", {on: {click: function () {
      var rows2 = [["fighter", "opponent", "win_rate", "margin", "won", "drew", "lost", "games"]];
      order.forEach(function (x) { order.forEach(function (y) {
        if (x.id === y.id) return;
        var mu = matchup(x.id, y.id);
        if (mu) rows2.push([x.name, y.name, mu.p.toFixed(4), mu.m.toFixed(4), mu.wins, mu.draws, mu.losses, mu.games]);
      }); });
      download("matchups.csv", rows2);
    }}}, [t("csvMatrix")]);
    return el("div", null, [
      el("p", {"class": "muted"}, [t("matrixIntro", {n: FEW})]), legend, el("div", {"class": "tools"}, [csv]),
      el("div", {"class": "panel scroll"}, [el("table", {"class": "matrix"}, [el("thead", null, [head]), el("tbody", null, rows)])])
    ]);
  }

  function fighterView() {
    if (picked == null || !byId[picked]) picked = ranked.length ? ranked[0].id : (fighters[0] && fighters[0].id);
    var f = byId[picked];
    if (!f) return el("p", null, [t("noData")]);
    var select = el("select", {on: {change: function (e) { picked = Number(e.target.value); render(); }}},
      ranked.map(function (x) {
        var o = el("option", {value: x.id}, [x.name + " — " + pct(x.p)]);
        if (x.id === f.id) o.selected = true;
        return o;
      }));
    var opponents = ranked.filter(function (y) { return y.id !== f.id; }).map(function (y) {
      return {y: y, mu: matchup(f.id, y.id)};
    }).filter(function (o) { return o.mu && o.mu.games; });
    var byRate = opponents.slice().sort(function (a, b) { return b.mu.p - a.mu.p; });
    function list(items) {
      if (!items.length) return el("p", {"class": "muted"}, [t("none")]);
      return el("ul", {"class": "plain"}, items.map(function (o) {
        return el("li", null, [nameLink(o.y), ": " + pct(o.mu.p) + " (" + num(o.mu.games) + " " + t("games") + ")"]);
      }));
    }
    var own = (movesOf[f.id] || []).slice();
    var dealt = 0;
    own.forEach(function (mv) { dealt += mv.damage; });
    var moveRows = own.filter(function (mv) { return mv.uses > 0; });
    var columns = [
      {label: t("mMove"), cls: "l", value: function (mv) { return moveName(mv); }, show: function (mv) {
        var share = dealt ? mv.damage / dealt : 0;
        var bits = [moveName(mv)];
        if (mv.isCatch) bits.push(" ", el("span", {"class": "chip"}, [t("catchTag")]));
        if (flagged(mv, share)) bits.push(" ", el("span", {"class": "flag"}, [t("flag")]));
        return el("span", null, bits);
      }},
      {label: t("mShare"), value: function (mv) { return dealt ? mv.damage / dealt : 0; }, show: function (mv) { return dealt ? pct(mv.damage / dealt) : "—"; }},
      {label: t("mUse"), value: function (mv) { return mv.uses / f.games; }, show: function (mv) { return num(mv.uses / f.games, 1); }},
      {label: t("mLand"), value: function (mv) { return mv.isCatch ? -1 : mv.landed / mv.uses; }, show: function (mv) { return mv.isCatch ? "—" : pct(mv.landed / mv.uses, 0); }},
      {label: t("mDmg"), value: function (mv) { return mv.damage / mv.uses; }, show: function (mv) { return num(mv.damage / mv.uses, 1); }},
      {label: t("mDmgLand"), value: function (mv) { return mv.landed ? mv.damage / mv.landed : 0; }, show: function (mv) { return mv.landed ? num(mv.damage / mv.landed, 0) : "—"; }},
      {label: t("mGuard"), value: function (mv) { return mv.guarded / mv.uses; }, show: function (mv) { return pct(mv.guarded / mv.uses, 0); }},
      {label: t("mPun"), value: function (mv) { return mv.punished / mv.uses; }, show: function (mv) { return pct(mv.punished / mv.uses, 0); }},
      {label: t("mUses"), value: function (mv) { return mv.uses; }, show: function (mv) { return num(mv.uses); }}
    ];
    var csv = el("button", {on: {click: function () {
      var rows2 = [["fighter", "move", "keys", "frame_name", "first_frame", "record", "uses", "landed", "damage", "guarded", "punished", "blows", "catch"]];
      fighters.forEach(function (x) { (movesOf[x.id] || []).forEach(function (mv) {
        rows2.push([x.name, moveName(mv), mv.keys, mv.frame, mv.e, mv.rec, mv.uses, mv.landed, mv.damage, mv.guarded, mv.punished, mv.blows, mv.isCatch ? 1 : 0]);
      }); });
      download("moves.csv", rows2);
    }}}, [t("csvMoves")]);
    var oppRows = opponents.map(function (o) {
      // (Frame -1: the other moves against this opponent, summed.)
      var list2 = (versusOf[f.id + " " + o.y.id] || []).slice().sort(function (a, b) { return b.damage - a.damage; });
      var total = 0;
      list2.forEach(function (x) { total += x.damage; });
      var top = list2.filter(function (x) { return x.e >= 0; })[0];
      var mv = top ? moveIndex[moveKey(f.id, top.r, top.e)] : null;
      return {y: o.y, mu: o.mu, top: top && mv ? moveName(mv) : "—", share: top && total ? top.damage / total : 0};
    });
    var oppColumns = [
      {label: t("oName"), cls: "l", value: function (o) { return o.y.name.toLowerCase(); }, show: function (o) { return nameLink(o.y); }},
      {label: t("oRate"), value: function (o) { return o.mu.p; }, show: function (o) { return rateBar(o.mu.p, o.mu.m); }},
      {label: t("oGames"), value: function (o) { return o.mu.games; }, show: function (o) { return num(o.mu.games); }},
      {label: t("oTop"), cls: "l", value: function (o) { return o.top; }},
      {label: t("oShare"), value: function (o) { return o.share; }, show: function (o) { return o.share ? pct(o.share, 0) : "—"; }}
    ];
    var unused = unusedOf[f.id] || [];
    var otherDealt = f.dealt - dealt;
    return el("div", null, [
      el("div", {"class": "tools"}, [el("label", null, [t("pick") + " "]), select]),
      el("div", {"class": "cards"}, [
        el("div", {"class": "card"}, [el("b", null, [pct(f.p)]), el("span", null, [t("cRate") + " ±" + num(f.m * 100, 1)])]),
        el("div", {"class": "card"}, [el("b", null, [num(f.wins) + " / " + num(f.draws) + " / " + num(f.losses)]), el("span", null, [t("cWins") + " / " + t("cDraws") + " / " + t("cLosses")])]),
        el("div", {"class": "card"}, [el("b", null, [num(f.dealt / Math.max(1, f.games))]), el("span", null, [t("cDealt")])]),
        el("div", {"class": "card"}, [el("b", null, [num(f.taken / Math.max(1, f.games))]), el("span", null, [t("cTaken")])])
      ]),
      el("div", {"class": "row2"}, [
        el("div", null, [el("h3", null, [t("easiest")]), list(byRate.slice(0, 5))]),
        el("div", null, [el("h3", null, [t("hardest")]), list(byRate.slice(-5).reverse())])
      ]),
      el("h2", null, [t("moves")]),
      el("div", {"class": "tools"}, [csv]),
      el("div", {"class": "panel"}, [table(columns, moveRows, 1)]),
      otherDealt > 0 ? el("p", {"class": "note"}, [t("other") + ": " + num(otherDealt) + " (" + pct(otherDealt / Math.max(1, f.dealt)) + ")"]) : null,
      el("h2", null, [t("perOpp")]),
      el("div", {"class": "panel"}, [table(oppColumns, oppRows, 1)]),
      el("h3", null, [t("unused")]),
      unused.length ? el("ul", {"class": "plain"}, unused.map(function (u) { return el("li", null, [(u.keys ? u.keys + " " : "") + (u.frame || t("frame")) + " (" + u.e + ")"]); }))
        : el("p", {"class": "muted"}, [t("none")])
    ]);
  }

  function drawsView() {
    var rows = D.p.filter(function (r) { return r[5] > 0; }).map(function (r) {
      return {a: byId[r[0]], b: byId[r[1]], games: r[2], draws: r[5], stalls: r[6], limits: r[7], both: r[5] - r[6] - r[7]};
    }).filter(function (r) { return r.a && r.b; });
    var columns = [
      {label: t("dPair"), cls: "l", value: function (r) { return r.a.name + " " + r.b.name; }, show: function (r) { return el("span", null, [nameLink(r.a), " — ", nameLink(r.b)]); }},
      {label: t("dDraws"), value: function (r) { return r.draws / r.games; }, show: function (r) { return pct(r.draws / r.games) + " (" + num(r.draws) + ")"; }},
      {label: t("dGames"), value: function (r) { return r.games; }, show: function (r) { return num(r.games); }},
      {label: t("dStall"), value: function (r) { return r.stalls; }, show: function (r) { return num(r.stalls); }},
      {label: t("dLimit"), value: function (r) { return r.limits; }, show: function (r) { return num(r.limits); }},
      {label: t("dBoth"), value: function (r) { return r.both; }, show: function (r) { return num(r.both); }}
    ];
    return el("div", null, [el("p", {"class": "muted"}, [t("drawsIntro")]),
      rows.length ? el("div", {"class": "panel"}, [table(columns, rows, 1)]) : el("p", null, [t("none")])]);
  }

  function readView() {
    var items = T[lang].read.map(function (s) {
      return s.split("{b}").join(aiLabel()).split("{w}").join(meta.weapons ? t("wOn") : t("wOff"))
        .split("{wd}").join(meta.weapons ? t("wOnD") : t("wOffD"));
    });
    return el("div", {"class": "panel"}, items.map(function (s) { return el("p", null, [s]); }));
  }

  function render() {
    app.textContent = "";
    app.appendChild(header());
    if (!meta.games) { app.appendChild(el("p", null, [t("noData")])); return; }
    app.appendChild(cards());
    app.appendChild(tabs());
    var view = tab === "matrix" ? matrixView() : tab === "fighter" ? fighterView() : tab === "draws" ? drawsView()
      : tab === "read" ? readView() : rankView();
    app.appendChild(view);
    app.appendChild(el("footer", null, [t("footer") + (meta.kit ? " " + meta.kit : "")]));
    document.title = t("title") + " — " + meta.mod;
  }
  document.documentElement.lang = lang;
  render();
})();
</script>
</body>
</html>
